<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- X-axis -->
  <line x1="50" y1="200" x2="380" y2="200" stroke="black" stroke-width="2" />
  <!-- X-axis arrow -->
  <polyline points="375,195 380,200 375,205" stroke="black" stroke-width="2" fill="black" />
  <!-- X-axis label -->
  <text x="370" y="220" font-family="Arial, sans-serif" font-size="16" text-anchor="end" fill="black">&#x221A;&#x03C1;</text>

  <!-- Y-axis -->
  <line x1="50" y1="200" x2="50" y2="20" stroke="black" stroke-width="2" />
  <!-- Y-axis arrow -->
  <polyline points="45,25 50,20 55,25" stroke="black" stroke-width="2" fill="black" />
  <!-- Y-axis label -->
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">n</text>

  <!-- Curve representing n vs sqrt(rho) -->
  <!-- This is an inverse relationship, similar to y = 1/x, thus a convex curve to the origin. -->
  <path d="M 70 60 C 70 100, 280 190, 350 190" stroke="black" stroke-width="2" fill="none" />
</svg>