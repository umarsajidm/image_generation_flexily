<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Suspension point -->
  <line x1="190" y1="30" x2="210" y2="30" stroke="black" stroke-width="2"/>

  <!-- String of the pendulum at point X -->
  <line x1="200" y1="30" x2="125" y2="159.9" stroke="black" stroke-width="1.5"/>

  <!-- Bob at point X -->
  <circle cx="125" cy="159.9" r="10" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="105" y="165" font-family="Arial, sans-serif" font-size="16" fill="black">X</text>

  <!-- Bob at point Y (lowest point of swing) -->
  <circle cx="200" cy="180" r="10" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="215" y="185" font-family="Arial, sans-serif" font-size="16" fill="black">Y</text>

  <!-- Arc path of the pendulum from X to Y -->
  <path d="M 125 159.9 A 150 150 0 0 1 200 180" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Dashed lines indicating the vertical height difference (h) between X and Y -->
  <line x1="125" y1="159.9" x2="200" y2="159.9" stroke="gray" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="200" y1="159.9" x2="200" y2="180" stroke="gray" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="205" y="170" font-family="Arial, sans-serif" font-size="14" fill="gray">h</text>
</svg>