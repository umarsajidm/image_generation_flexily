<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles for text and lines -->
  <defs>
    <style>
      .equation-text { font-family: 'serif'; font-size: 18px; fill: black; text-anchor: start; }
      .matrix-element { font-family: 'serif'; font-size: 14px; fill: black; text-anchor: middle; }
      .matrix-bracket { stroke: black; stroke-width: 1; fill: none; }
      .arrow { stroke: black; stroke-width: 1; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Equation 1: X * A = I -->
  <text x="95" y="60" class="equation-text">X</text>

  <!-- Matrix A -->
  <g class="matrix-bracket">
    <line x1="115" y1="35" x2="115" y2="85" />
    <line x1="115" y1="35" x2="118" y2="35" />
    <line x1="115" y1="85" x2="118" y2="85" />
  </g>
  <text x="150" y="50" class="matrix-element">5</text>
  <text x="190" y="50" class="matrix-element">7</text>
  <text x="150" y="75" class="matrix-element">-2</text>
  <text x="190" y="75" class="matrix-element">1</text>
  <g class="matrix-bracket">
    <line x1="215" y1="35" x2="215" y2="85" />
    <line x1="215" y1="35" x2="212" y2="35" />
    <line x1="215" y1="85" x2="212" y2="85" />
  </g>

  <text x="235" y="60" class="equation-text">=</text>

  <!-- Identity Matrix I -->
  <g class="matrix-bracket">
    <line x1="255" y1="35" x2="255" y2="85" />
    <line x1="255" y1="35" x2="258" y2="35" />
    <line x1="255" y1="85" x2="258" y2="85" />
  </g>
  <text x="290" y="50" class="matrix-element">1</text>
  <text x="325" y="50" class="matrix-element">0</text>
  <text x="290" y="75" class="matrix-element">0</text>
  <text x="325" y="75" class="matrix-element">1</text>
  <g class="matrix-bracket">
    <line x1="355" y1="35" x2="355" y2="85" />
    <line x1="355" y1="35" x2="352" y2="35" />
    <line x1="355" y1="85" x2="352" y2="85" />
  </g>

  <!-- Arrow indicating solution step -->
  <line x1="225" y1="95" x2="225" y2="140" class="arrow" />

  <!-- Equation 2: X = A^(-1) -->
  <text x="95" y="180" class="equation-text">X</text>
  <text x="120" y="180" class="equation-text">=</text>

  <!-- Result Matrix (Inverse of A) -->
  <g class="matrix-bracket">
    <line x1="140" y1="155" x2="140" y2="205" />
    <line x1="140" y1="155" x2="143" y2="155" />
    <line x1="140" y1="205" x2="143" y2="205" />
  </g>
  <text x="175" y="170" class="matrix-element">1/19</text>
  <text x="225" y="170" class="matrix-element">-7/19</text>
  <text x="175" y="195" class="matrix-element">2/19</text>
  <text x="225" y="195" class="matrix-element">5/19</text>
  <g class="matrix-bracket">
    <line x1="250" y1="155" x2="250" y2="205" />
    <line x1="250" y1="155" x2="247" y2="155" />
    <line x1="250" y1="205" x2="247" y2="205" />
  </g>
</svg>