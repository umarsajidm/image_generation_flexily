<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles for cleanliness and readability -->
  <style>
    .plane {
      stroke: black;
      stroke-width: 1.5;
      fill: none; /* Make planes transparent to show outlines only */
    }
    .label {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: black;
      text-anchor: middle;
    }
    .solution-point {
      fill: #00F; /* Blue color for the solution point */
      stroke: black;
      stroke-width: 0.5;
    }
    .solution-label {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: black;
      text-anchor: start;
    }
  </style>

  <!-- Plane 3 (representing the third equation, drawn first for z-order) -->
  <path d="M 60 170 L 340 80 L 320 70 L 40 160 Z" class="plane" />
  <text x="100" y="80" class="label">Eq 3</text>

  <!-- Plane 1 (representing the first equation) -->
  <path d="M 80 110 L 320 110 L 300 140 L 60 140 Z" class="plane" />
  <text x="190" y="158" class="label">Eq 1</text>

  <!-- Plane 2 (representing the second equation) -->
  <path d="M 190 60 L 220 60 L 240 180 L 210 180 Z" class="plane" />
  <text x="265" y="115" class="label">Eq 2</text>

  <!-- Intersection Point (Solution) -->
  <circle cx="200" cy="125" r="4" class="solution-point" />
  <text x="210" y="140" class="solution-label">Solution Point</text>
</svg>