<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* All elements are black for minimalism, adhering to "clean black lines" */
    .line-style {
      stroke: black;
      stroke-width: 1;
      fill: none;
    }
    .arrowhead {
      fill: black;
      stroke: none;
    }
    .graph-main-line { /* Main graph line is slightly thicker for emphasis */
      stroke: black;
      stroke-width: 2;
      fill: none;
    }
    .label {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: black;
    }
    .dashed-line {
      stroke: black;
      stroke-width: 1;
      stroke-dasharray: 4 2; /* Creates a dashed line effect */
    }
    .point-marker {
        fill: black;
        stroke: black;
        stroke-width: 1;
    }
  </style>

  <!-- X-axis -->
  <path d="M50 125 H350" class="line-style" />
  <!-- X-axis arrowhead -->
  <path d="M350 125 L345 120 L345 130 Z" class="arrowhead" /> 
  <!-- X-axis label -->
  <text x="360" y="130" class="label">x (m)</text>

  <!-- Y-axis -->
  <path d="M200 225 V25" class="line-style" />
  <!-- Y-axis arrowhead -->
  <path d="M200 25 L195 30 L205 30 Z" class="arrowhead" />
  <!-- Y-axis label -->
  <text x="180" y="20" class="label">F (N)</text>

  <!-- Origin label -->
  <text x="190" y="140" class="label">0</text>

  <!-- Graph Line (F = -kx, assuming a linear restoring force for SHM) -->
  <!-- The line goes from (x=-0.04m, F=0.08N) to (x=0.04m, F=-0.08N) in real values, -->
  <!-- which correspond to pixel coordinates (50, 25) to (350, 225) in this viewBox. -->
  <line x1="50" y1="25" x2="350" y2="225" class="graph-main-line" />

  <!-- Marked point on the graph: (0.03 m, -0.06 N) -->
  <!-- Pixel coordinates for (0.03, -0.06): x = 200 + (0.03 * (300/0.08)) = 312.5, y = 125 + (0.06 * (200/0.16)) = 200 -->
  <circle cx="312.5" cy="200" r="3" class="point-marker" />
  
  <!-- Dashed lines from the marked point to the axes -->
  <line x1="312.5" y1="200" x2="312.5" y2="125" class="dashed-line" /> <!-- To X-axis -->
  <line x1="312.5" y1="200" x2="200" y2="200" class="dashed-line" /> <!-- To Y-axis -->

  <!-- Labels for the marked point's coordinates -->
  <text x="300" y="145" class="label">0.03</text>
  <text x="160" y="205" class="label">-0.06</text>
</svg>