<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="50" y1="125" x2="380" y2="125" stroke="black" stroke-width="1"/> <!-- X-axis (Time) -->
  <line x1="50" y1="20" x2="50" y2="230" stroke="black" stroke-width="1"/> <!-- Y-axis (Amplitude) -->

  <!-- Axis arrows -->
  <polyline points="375,120 380,125 375,130" stroke="black" fill="none" stroke-width="1"/> <!-- X-axis arrow -->
  <polyline points="45,25 50,20 55,25" stroke="black" fill="none" stroke-width="1"/> <!-- Y-axis arrow -->

  <!-- Axis labels -->
  <text x="360" y="145" font-family="Arial, sans-serif" font-size="16" fill="black">t</text>
  <text x="40" y="30" font-family="Arial, sans-serif" font-size="16" fill="black">A</text>

  <!-- Envelope paths (dashed lines indicating decaying amplitude) -->
  <path d="M 50 200 Q 150 160 250 135 Q 320 128 380 126" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4 2"/> <!-- Top envelope -->
  <path d="M 50 50 Q 150 90 250 115 Q 320 122 380 124" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4 2"/> <!-- Bottom envelope -->

  <!-- Oscillating wave path (main wave, thicker line) -->
  <path d="M 50 200 Q 75 125 100 50 Q 125 125 150 170 Q 175 125 200 80 Q 225 125 250 145 Q 275 125 300 105 Q 325 125 350 128 Q 365 125 380 125"
        fill="none" stroke="black" stroke-width="2"/>
</svg>