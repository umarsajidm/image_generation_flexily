<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Fixed support -->
  <rect x="185" y="20" width="30" height="10" fill="black" />
  <text x="200" y="15" font-family="Arial, sans-serif" font-size="14" fill="black" text-anchor="middle">Fixed Point</text>
  
  <!-- Pivot point -->
  <circle cx="200" cy="30" r="3" fill="black" />

  <!-- Pendulum at Extreme Position X -->
  <line x1="200" y1="30" x2="130" y2="151" stroke="black" stroke-width="2" />
  <circle cx="130" cy="151" r="15" fill="black" />
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="16" fill="black">X</text>

  <!-- Pendulum at Mean Position Y -->
  <line x1="200" y1="30" x2="200" y2="170" stroke="black" stroke-width="2" />
  <circle cx="200" cy="170" r="15" fill="black" />
  <text x="210" y="174" font-family="Arial, sans-serif" font-size="16" fill="black">Y</text>

  <!-- Arc path showing movement from X to Y -->
  <!-- M 130 151 (start X) A 140 140 (radius) 0 (x-axis-rotation) 0 (large-arc-flag) 1 (sweep-flag, clockwise) 200 170 (end Y) -->
  <path d="M 130 151 A 140 140 0 0 1 200 170" fill="none" stroke="gray" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Arrowhead on the arc indicating direction of movement -->
  <!-- Positioned near Y along the arc, pointing towards Y -->
  <polygon points="195,169 190,167 190,171" fill="gray" />

  <!-- Time indication -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="14" fill="black" text-anchor="middle">Time (X to Y) = 1.5 s</text>
</svg>