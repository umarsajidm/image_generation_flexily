<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: sans-serif;
      font-size: 16px;
      fill: black;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .det-bar {
      stroke: black;
      stroke-width: 1.5;
    }
    .pos-diag {
      stroke: #007bff; /* Light blue for positive terms */
      stroke-width: 2;
      fill: none;
      opacity: 0.7;
    }
    .neg-diag {
      stroke: #dc3545; /* Light red for negative terms */
      stroke-width: 2;
      fill: none;
      opacity: 0.7;
      stroke-dasharray: 4 2; /* Dashed line for negative terms */
    }
    .result-text {
        font-size: 18px;
        font-weight: bold;
    }
  </style>

  <!-- Numbers of the matrix and repeated columns for Sarrus' Rule -->
  <!-- Row 1 -->
  <text x="100" y="60">4</text>
  <text x="140" y="60">-3</text>
  <text x="180" y="60">2</text>
  <text x="220" y="60">4</text>
  <text x="260" y="60">-3</text>

  <!-- Row 2 -->
  <text x="100" y="90">5</text>
  <text x="140" y="90">7</text>
  <text x="180" y="90">1</text>
  <text x="220" y="90">5</text>
  <text x="260" y="90">7</text>

  <!-- Row 3 -->
  <text x="100" y="120">0</text>
  <text x="140" y="120">3</text>
  <text x="180" y="120">2</text>
  <text x="220" y="120">0</text>
  <text x="260" y="120">3</text>

  <!-- Determinant bars for the original 3x3 matrix -->
  <line x1="80" y1="40" x2="80" y2="140" class="det-bar" />
  <line x1="200" y1="40" x2="200" y2="140" class="det-bar" />

  <!-- Sarrus' Rule Diagonals -->
  <!-- Positive diagonals (top-left to bottom-right) -->
  <line x1="100" y1="60" x2="180" y2="120" class="pos-diag" /> <!-- 4*7*2 -->
  <line x1="140" y1="60" x2="220" y2="120" class="pos-diag" /> <!-- -3*1*0 -->
  <line x1="180" y1="60" x2="260" y2="120" class="pos-diag" /> <!-- 2*5*3 -->

  <!-- Negative diagonals (top-right to bottom-left in the expanded view) -->
  <line x1="180" y1="60" x2="100" y2="120" class="neg-diag" /> <!-- 2*7*0 -->
  <line x1="220" y1="60" x2="140" y2="120" class="neg-diag" /> <!-- 4*1*3 -->
  <line x1="260" y1="60" x2="180" y2="120" class="neg-diag" /> <!-- -3*5*2 -->

  <!-- Result label -->
  <text x="200" y="190" class="result-text">Result = 104</text>
</svg>