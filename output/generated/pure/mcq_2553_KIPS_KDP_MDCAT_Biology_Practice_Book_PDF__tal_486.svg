<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Presynaptic Terminal -->
  <rect x="50" y="50" width="240" height="80" rx="10" ry="10" fill="none" stroke="black" stroke-width="2"/>

  <!-- Synaptic Cleft demarcation -->
  <line x1="50" y1="132" x2="290" y2="132" stroke="black" stroke-width="1"/>
  <line x1="50" y1="148" x2="290" y2="148" stroke="black" stroke-width="1"/>

  <!-- Postsynaptic Membrane (simplified folds, muscle endplate) -->
  <path d="M50 170 Q80 160 110 170 Q140 180 170 170 Q200 160 230 170 Q260 180 290 170"
        fill="none" stroke="black" stroke-width="2"/>

  <!-- Region X: Synaptic vesicles inside presynaptic terminal -->
  <circle cx="120" cy="90" r="8" fill="none" stroke="black" stroke-width="1"/>
  <circle cx="160" cy="100" r="8" fill="none" stroke="black" stroke-width="1"/>
  <circle cx="200" cy="90" r="8" fill="none" stroke="black" stroke-width="1"/>
  <text x="180" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">X</text>
  <line x1="185" y1="75" x2="185" y2="85" stroke="black" stroke-width="1" />

  <!-- Arrowhead definition for neurotransmitter flow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Arrow for release from X to cleft -->
  <line x1="170" y1="115" x2="170" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Region Y: Neurotransmitters in synaptic cleft (represented as small squares) -->
  <rect x="150" y="138" width="5" height="5" fill="black"/>
  <rect x="170" y="143" width="5" height="5" fill="black"/>
  <rect x="190" y="138" width="5" height="5" fill="black"/>
  <text x="170" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Y</text>
  <line x1="175" y1="155" x2="175" y2="148" stroke="black" stroke-width="1" />

  <!-- Region Z: Receptors on postsynaptic membrane -->
  <rect x="130" y="168" width="20" height="7" fill="none" stroke="black" stroke-width="1"/>
  <rect x="180" y="168" width="20" height="7" fill="none" stroke="black" stroke-width="1"/>
  <rect x="230" y="168" width="20" height="7" fill="none" stroke="black" stroke-width="1"/>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Z</text>
  <line x1="205" y1="185" x2="205" y2="175" stroke="black" stroke-width="1" />

  <!-- Arrow for binding to Z -->
  <line x1="175" y1="148" x2="175" y2="168" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>